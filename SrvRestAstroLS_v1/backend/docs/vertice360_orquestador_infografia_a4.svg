<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 2480 3508" role="img" aria-labelledby="title desc">
  <title id="title">Vertice360 Orquestador - Infografia ejecutiva A4</title>
  <desc id="desc">Resumen ejecutivo del proyecto Vertice360 Orquestador: propuesta de valor, flujo punta a punta, stack operativo y estado validado.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f7f2"/>
      <stop offset="55%" stop-color="#f0efe7"/>
      <stop offset="100%" stop-color="#e9ece6"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#153b52"/>
      <stop offset="100%" stop-color="#226067"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e77a39"/>
      <stop offset="100%" stop-color="#f0b04b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#173241" flood-opacity="0.12"/>
    </filter>
    <style>
      .sans { font-family: "DejaVu Sans", "Segoe UI", Arial, sans-serif; }
      .title { font-size: 92px; font-weight: 700; fill: #ffffff; letter-spacing: -1.5px; }
      .subtitle { font-size: 42px; font-weight: 400; fill: #d7e5e1; }
      .eyebrow { font-size: 28px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; fill: #8fd0c0; }
      .section { font-size: 34px; font-weight: 700; letter-spacing: 1px; fill: #153b52; }
      .body { font-size: 30px; font-weight: 400; fill: #2f3c44; }
      .small { font-size: 25px; font-weight: 400; fill: #55636c; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; fill: #6d7b83; }
      .chip { font-size: 24px; font-weight: 700; fill: #153b52; }
      .step-num { font-size: 34px; font-weight: 700; fill: #ffffff; }
      .step-title { font-size: 31px; font-weight: 700; fill: #163347; }
      .step-body { font-size: 26px; font-weight: 400; fill: #4a5760; }
      .metric { font-size: 28px; font-weight: 700; fill: #173241; }
      .ok { font-size: 28px; font-weight: 700; fill: #206052; }
      .footer { font-size: 22px; font-weight: 400; fill: #6e7d84; }
    </style>
  </defs>

  <rect width="2480" height="3508" fill="url(#bg)"/>
  <circle cx="2150" cy="180" r="280" fill="#d7e6df"/>
  <circle cx="2280" cy="620" r="130" fill="#f0d7b5"/>
  <circle cx="140" cy="3220" r="220" fill="#d6e4df"/>

  <rect x="88" y="88" width="2304" height="520" rx="44" fill="url(#hero)"/>
  <rect x="88" y="88" width="2304" height="16" rx="8" fill="url(#accent)"/>
  <text class="sans eyebrow" x="180" y="196">Resumen Ejecutivo</text>
  <text class="sans title" x="180" y="310">Vertice360 Orquestador</text>
  <text class="sans subtitle" x="180" y="392">Orquestá tus leads por WhatsApp, automatizá el seguimiento y tené control total: del anuncio al cierre.</text>

  <g transform="translate(180 464)">
    <rect x="0" y="0" width="308" height="74" rx="18" fill="#ffffff" fill-opacity="0.12"/>
    <text class="sans chip" x="34" y="47" fill="#ffffff">WhatsApp + tablero</text>
    <rect x="336" y="0" width="312" height="74" rx="18" fill="#ffffff" fill-opacity="0.12"/>
    <text class="sans chip" x="370" y="47" fill="#ffffff">Visitas y follow-up</text>
    <rect x="676" y="0" width="294" height="74" rx="18" fill="#ffffff" fill-opacity="0.12"/>
    <text class="sans chip" x="710" y="47" fill="#ffffff">Demo operable</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="120" y="670" width="640" height="740" rx="34" fill="#ffffff"/>
    <rect x="820" y="670" width="840" height="1860" rx="34" fill="#ffffff"/>
    <rect x="1720" y="670" width="640" height="1020" rx="34" fill="#ffffff"/>
    <rect x="1720" y="1730" width="640" height="800" rx="34" fill="#ffffff"/>
    <rect x="120" y="1450" width="640" height="1080" rx="34" fill="#ffffff"/>
    <rect x="120" y="2570" width="2240" height="780" rx="34" fill="#ffffff"/>
  </g>

  <g transform="translate(170 735)">
    <text class="sans label" x="0" y="0">Que es</text>
    <text class="sans section" x="0" y="58">Un flujo comercial conversacional</text>
    <text class="sans body" x="0" y="128">Vertice360 combina inventario, contexto</text>
    <text class="sans body" x="0" y="170">comercial y coordinacion operativa en un</text>
    <text class="sans body" x="0" y="212">mismo circuito de WhatsApp.</text>

    <rect x="0" y="272" width="560" height="118" rx="24" fill="#f2f5f2"/>
    <circle cx="44" cy="330" r="10" fill="#e77a39"/>
    <text class="sans body" x="74" y="340">Consulta productos, precios, entrega</text>
    <rect x="0" y="418" width="560" height="118" rx="24" fill="#f2f5f2"/>
    <circle cx="44" cy="476" r="10" fill="#e77a39"/>
    <text class="sans body" x="74" y="486">Abre visitas y captura preferencia horaria</text>
    <rect x="0" y="564" width="560" height="118" rx="24" fill="#f2f5f2"/>
    <circle cx="44" cy="622" r="10" fill="#e77a39"/>
    <text class="sans body" x="74" y="632">Escala internamente con advisor y supervisor</text>
  </g>

  <g transform="translate(870 735)">
    <text class="sans label" x="0" y="0">Flujo Punta a Punta</text>
    <text class="sans section" x="0" y="58">Del anuncio al seguimiento interno</text>

    <line x1="92" y1="180" x2="92" y2="1450" stroke="#cad4d7" stroke-width="12" stroke-linecap="round"/>

    <g transform="translate(0 130)">
      <circle cx="92" cy="55" r="42" fill="#153b52"/>
      <text class="sans step-num" x="78" y="67">1</text>
      <rect x="170" y="0" width="590" height="132" rx="24" fill="#f2f5f2"/>
      <text class="sans step-title" x="208" y="52">Lead entra por WhatsApp</text>
      <text class="sans step-body" x="208" y="92">Onboarding, seleccion de proyecto y primera consulta.</text>
    </g>

    <g transform="translate(0 410)">
      <circle cx="92" cy="55" r="42" fill="#153b52"/>
      <text class="sans step-num" x="76" y="67">2</text>
      <rect x="170" y="0" width="590" height="154" rx="24" fill="#f2f5f2"/>
      <text class="sans step-title" x="208" y="52">Contexto comercial</text>
      <text class="sans step-body" x="208" y="92">Proyecto actual persistido, consultas de precio,</text>
      <text class="sans step-body" x="208" y="126">features, entrega y opciones puntuales.</text>
    </g>

    <g transform="translate(0 720)">
      <circle cx="92" cy="55" r="42" fill="#153b52"/>
      <text class="sans step-num" x="76" y="67">3</text>
      <rect x="170" y="0" width="590" height="176" rx="24" fill="#f2f5f2"/>
      <text class="sans step-title" x="208" y="52">Solicitud de visita</text>
      <text class="sans step-body" x="208" y="92">La visita ya no se abre sin proyecto claro.</text>
      <text class="sans step-body" x="208" y="126">Primero pide proyecto; despues pasa a</text>
      <text class="sans step-body" x="208" y="160">Pendiente de visita y pregunta horario.</text>
    </g>

    <g transform="translate(0 1080)">
      <circle cx="92" cy="55" r="42" fill="#153b52"/>
      <text class="sans step-num" x="76" y="67">4</text>
      <rect x="170" y="0" width="590" height="176" rx="24" fill="#f2f5f2"/>
      <text class="sans step-title" x="208" y="52">Refinamiento conversacional</text>
      <text class="sans step-body" x="208" y="92">"manana", "por la tarde", "cualquiera" y</text>
      <text class="sans step-body" x="208" y="126">variantes se interpretan como agenda de visita,</text>
      <text class="sans step-body" x="208" y="160">no como sol, luz ni disponibilidad de unidades.</text>
    </g>

    <g transform="translate(0 1450)">
      <circle cx="92" cy="55" r="42" fill="#153b52"/>
      <text class="sans step-num" x="76" y="67">5</text>
      <rect x="170" y="0" width="590" height="176" rx="24" fill="#f2f5f2"/>
      <text class="sans step-title" x="208" y="52">Follow-up interno</text>
      <text class="sans step-body" x="208" y="92">Evaluate general procesa pendientes demo y</text>
      <text class="sans step-body" x="208" y="126">escala por WhatsApp a advisor y supervisor</text>
      <text class="sans step-body" x="208" y="160">segun delays configurados.</text>
    </g>
  </g>

  <g transform="translate(1770 735)">
    <text class="sans label" x="0" y="0">Capas del Sistema</text>
    <text class="sans section" x="0" y="58">Stack operativo actual</text>

    <rect x="0" y="108" width="540" height="126" rx="26" fill="#153b52"/>
    <text class="sans step-title" x="38" y="164" fill="#ffffff">Canal</text>
    <text class="sans body" x="38" y="204" fill="#d7e5e1">WhatsApp y Gupshup</text>

    <rect x="0" y="264" width="540" height="126" rx="26" fill="#2a6f6d"/>
    <text class="sans step-title" x="38" y="320" fill="#ffffff">Orquestacion</text>
    <text class="sans body" x="38" y="360" fill="#dff1ea">Backend Litestar</text>

    <rect x="0" y="420" width="540" height="162" rx="26" fill="#f2f5f2"/>
    <text class="sans step-title" x="38" y="474">Logica</text>
    <text class="sans body" x="38" y="514">Intents, contexto, proyecto actual,</text>
    <text class="sans body" x="38" y="552">visitas, pending questions y follow-up.</text>

    <rect x="0" y="612" width="540" height="182" rx="26" fill="#f2f5f2"/>
    <text class="sans step-title" x="38" y="666">Datos</text>
    <text class="sans body" x="38" y="706">Proyectos, unidades, tickets,</text>
    <text class="sans body" x="38" y="744">runtime conversacional y</text>
    <text class="sans body" x="38" y="782">visit_followup_config.</text>

    <rect x="0" y="834" width="540" height="122" rx="26" fill="#f9ead7"/>
    <text class="sans metric" x="38" y="886">Modo demo operable</text>
    <text class="sans body" x="38" y="926">Reset, config, evaluate y dashboard.</text>
  </g>

  <g transform="translate(1770 1795)">
    <text class="sans label" x="0" y="0">Operacion Demo</text>
    <text class="sans section" x="0" y="58">Runbook resumido</text>

    <rect x="0" y="110" width="540" height="110" rx="22" fill="#f2f5f2"/>
    <text class="sans metric" x="34" y="172">1. Reset runtime</text>
    <text class="sans small" x="34" y="208">Arranca en cero sin borrar config ni base.</text>

    <rect x="0" y="248" width="540" height="110" rx="22" fill="#f2f5f2"/>
    <text class="sans metric" x="34" y="310">2. Set config celulares</text>
    <text class="sans small" x="34" y="346">Advisor y supervisor por cliente tecnico.</text>

    <rect x="0" y="386" width="540" height="110" rx="22" fill="#f2f5f2"/>
    <text class="sans metric" x="34" y="448">3. Ejecutar evaluate</text>
    <text class="sans small" x="34" y="484">General para demo; puntual con ticket_id si hace falta.</text>

    <rect x="0" y="524" width="540" height="170" rx="22" fill="#f9ead7"/>
    <text class="sans metric" x="34" y="586">Validado en produccion</text>
    <text class="sans body" x="34" y="630">Level 1 al advisor y level 2 al supervisor</text>
    <text class="sans body" x="34" y="668">por WhatsApp, con evaluate general activo.</text>
  </g>

  <g transform="translate(170 1515)">
    <text class="sans label" x="0" y="0">Valor de Negocio</text>
    <text class="sans section" x="0" y="58">Lo que ordena el proceso comercial</text>

    <rect x="0" y="118" width="560" height="188" rx="26" fill="#f2f5f2"/>
    <text class="sans metric" x="34" y="174">1. Menos friccion</text>
    <text class="sans body" x="34" y="218">La conversacion avanza con proyecto y</text>
    <text class="sans body" x="34" y="256">objetivo claros antes de abrir tareas humanas.</text>

    <rect x="0" y="336" width="560" height="188" rx="26" fill="#f2f5f2"/>
    <text class="sans metric" x="34" y="392">2. Mejor trazabilidad</text>
    <text class="sans body" x="34" y="436">La visita queda ligada al proyecto actual y</text>
    <text class="sans body" x="34" y="474">ya no mezcla pedidos previos de otros desarrollos.</text>

    <rect x="0" y="554" width="560" height="188" rx="26" fill="#f2f5f2"/>
    <text class="sans metric" x="34" y="610">3. Coordinacion real</text>
    <text class="sans body" x="34" y="654">Las respuestas de horario refinan la misma</text>
    <text class="sans body" x="34" y="692">visita y escalan internamente cuando corresponde.</text>

    <rect x="0" y="792" width="560" height="188" rx="26" fill="#153b52"/>
    <text class="sans metric" x="34" y="848" fill="#ffffff">Snapshot actual</text>
    <text class="sans body" x="34" y="892" fill="#d7e5e1">Backend desplegado, runbook operativo,</text>
    <text class="sans body" x="34" y="930" fill="#d7e5e1">reset seguro y demo presencial lista.</text>
  </g>

  <g transform="translate(170 2635)">
    <text class="sans label" x="0" y="0">Estado Validado</text>
    <text class="sans section" x="0" y="58">Lo comprobado end-to-end</text>

    <rect x="0" y="120" width="2140" height="540" rx="28" fill="#f2f5f2"/>

    <g transform="translate(40 164)">
      <circle cx="18" cy="18" r="10" fill="#2a6f6d"/>
      <text class="sans ok" x="52" y="28">Seleccion de proyecto estable y contexto persistente.</text>

      <circle cx="18" cy="98" r="10" fill="#2a6f6d"/>
      <text class="sans ok" x="52" y="108">La visita ya no se abre sin proyecto seleccionado o inferido con claridad.</text>

      <circle cx="18" cy="178" r="10" fill="#2a6f6d"/>
      <text class="sans ok" x="52" y="188">Cambio de proyecto sin contaminar visitas previas.</text>

      <circle cx="18" cy="258" r="10" fill="#2a6f6d"/>
      <text class="sans ok" x="52" y="268">"manana", "por la tarde", "cualquiera" y similares resueltos como agenda de visita.</text>

      <circle cx="18" cy="338" r="10" fill="#2a6f6d"/>
      <text class="sans ok" x="52" y="348">"opciones puntuales" mantiene el proyecto actual.</text>

      <circle cx="18" cy="418" r="10" fill="#2a6f6d"/>
      <text class="sans ok" x="52" y="428">Follow-up interno validado: level 1 advisor, level 2 supervisor.</text>
    </g>

    <rect x="0" y="694" width="2140" height="22" rx="11" fill="url(#accent)"/>
  </g>

  <text class="sans footer" x="120" y="3420">Vertice360 Orquestador | Infografia ejecutiva A4 | Preparada para exportar a PNG de alta resolucion</text>
  <text class="sans footer" x="2160" y="3420" text-anchor="end">2026-03-24</text>
</svg>
